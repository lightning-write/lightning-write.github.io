<title>MYWONGO 라이트닝</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;700&display=swap">
<style>
@font-face{font-family:'KoPub Batang';src:url('kopub-batang-light.woff') format('woff');font-weight:400;font-style:normal;font-display:swap}
/* 앱(MYWONGO)과 같은 종이·잉크·남색. 번개로 흘러나오는 문장만 남색 물빛과 점선 밑줄로 구분한다 */
:root{
  --paper:#ffffff; --ink:#1f2328; --muted:#66707c; --line:#cdd3da; --chrome:#f4f5f7; --hover:#e8ecf1;
  --accent:#2c4a6e; --accent-ink:#ffffff; --live:rgba(44,74,110,.08); --warn:#a4462b; --scrim:rgba(18,22,28,.32);
  --t-del:#a4462b; --t-del-bg:rgba(164,70,43,.11); --t-ins:#2e6a44; --t-ins-bg:rgba(46,120,72,.13);
  --t-memo:#56606c; --t-memo-bg:rgba(86,96,108,.12); --t-mat:#865710; --t-mat-bg:rgba(196,138,36,.17);
  --serif:'KoPub Batang','Noto Serif KR',serif;
  --ui:'Noto Sans KR',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1c2025; --ink:#dedad2; --muted:#8e97a1; --line:#313740; --chrome:#181b1f; --hover:#252a31;
    --accent:#93b3da; --accent-ink:#0e1620; --live:rgba(147,179,218,.11); --warn:#e3906f; --scrim:rgba(0,0,0,.5);
    --t-del:#e8977a; --t-del-bg:rgba(232,151,122,.14); --t-ins:#8fd1a2; --t-ins-bg:rgba(143,209,162,.13);
    --t-memo:#a3acb7; --t-memo-bg:rgba(163,172,183,.13); --t-mat:#e6bd6e; --t-mat-bg:rgba(230,189,110,.15);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1c2025; --ink:#dedad2; --muted:#8e97a1; --line:#313740; --chrome:#181b1f; --hover:#252a31;
  --accent:#93b3da; --accent-ink:#0e1620; --live:rgba(147,179,218,.11); --warn:#e3906f; --scrim:rgba(0,0,0,.5);
  --t-del:#e8977a; --t-del-bg:rgba(232,151,122,.14); --t-ins:#8fd1a2; --t-ins-bg:rgba(143,209,162,.13);
  --t-memo:#a3acb7; --t-memo-bg:rgba(163,172,183,.13); --t-mat:#e6bd6e; --t-mat-bg:rgba(230,189,110,.15);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:14px;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap;line-height:1.4}
button:hover{background:var(--hover)}
button:disabled{opacity:.5;cursor:default}
button:disabled:hover{background:var(--paper)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.primary:hover{filter:brightness(1.08);background:var(--accent)}
button.ghost{background:transparent;border-color:transparent}
button.ghost:hover{background:var(--hover)}
.icon{width:36px;height:36px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-color:transparent;background:transparent;border-radius:8px;flex:none}
.icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hint{color:var(--muted);font-size:12.5px;line-height:1.6}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex:none}
.seg-b{border:0;border-radius:0;padding:4px 10px;font-size:12.5px;background:var(--paper)}
.seg-b + .seg-b{border-left:1px solid var(--line)}
.seg-b.on,.seg-b.on:hover{background:var(--accent);color:var(--accent-ink)}

#app{display:flex;flex-direction:column;height:100%}
#bar{flex:none;background:var(--chrome);border-bottom:1px solid var(--line);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
#head{display:flex;align-items:center;gap:6px;flex:1 1 260px;min-width:0}
#title{flex:1;min-width:0;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 8px;font-size:15px;font-weight:500}
#title:hover,#title:focus{border-color:var(--line);background:var(--paper)}
#saveState{font-size:12px;color:var(--muted);white-space:nowrap;flex:none}
#saveState.due{color:var(--accent);font-weight:500}
#tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg-b.ic{padding:3px 8px;display:inline-flex;align-items:center}
.seg-b svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.icon.primary,.icon.primary:hover{background:var(--accent);color:var(--accent-ink)}
.icon.primary.busy{opacity:.6}
.icon[aria-disabled="true"]{opacity:.45}
#fragBtn{position:relative}
.badge{position:absolute;top:1px;right:0;min-width:15px;height:15px;border-radius:8px;padding:0 3px;background:var(--accent);color:var(--accent-ink);font-size:10px;line-height:15px;text-align:center;font-variant-numeric:tabular-nums}
.badge:empty{display:none}
#tip{position:fixed;z-index:80;max-width:260px;background:var(--ink);color:var(--paper);border-radius:8px;padding:7px 10px;font-size:12.5px;line-height:1.5;box-shadow:0 6px 24px rgba(0,0,0,.22);pointer-events:none}
#tip b{display:block;font-weight:600}
#tip span{display:block;opacity:.85;margin-top:1px}
/* 위치 띠: 단계 칸(지금 여기는 남색), 커서까지의 분량은 눈금 */
#band{flex:none;display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;background:var(--paper);border-bottom:1px solid var(--line);padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:12.5px;color:var(--muted)}
.band-segs{position:relative;display:flex;flex:1 1 260px;min-width:0;height:22px;border-radius:5px;overflow:hidden}
.band-segs button{min-width:0;border:0;border-radius:0;border-right:2px solid var(--paper);background:var(--chrome);color:var(--muted);font-size:11px;padding:0;font-variant-numeric:tabular-nums;line-height:22px}
.band-segs button:last-of-type{border-right:0}
.band-segs button:hover{background:var(--hover)}
.band-segs button.cur,.band-segs button.cur:hover{background:var(--accent);color:var(--accent-ink)}
.band-at{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--warn);pointer-events:none}
.band-at::before{content:"";position:absolute;top:-1px;left:-4px;border:5px solid transparent;border-top-color:var(--warn)}
.band-tx{white-space:nowrap;font-variant-numeric:tabular-nums}
.band-tx b{color:var(--ink);font-weight:500}
.band-gap{color:var(--muted);font-style:italic}
#scroll{flex:1;min-height:0;overflow:auto;background:var(--paper);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#notice{max-width:720px;margin:16px auto 0;border:1px solid var(--accent);border-radius:8px;padding:10px 14px;display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap;font-size:13px;line-height:1.55}
#notice span{flex:1 1 220px;min-width:0}
#paper{position:relative;max-width:720px;margin:0 auto;min-height:100%;padding:48px 0 200px;font-family:var(--serif);font-size:17px;line-height:1.95;text-align:justify;overflow-wrap:break-word;outline:none;caret-color:var(--accent)}
#paper div,#paper p{margin:0;min-height:1em}
#paper > div:not(.chap),#paper > p{text-indent:1em}
#paper .chap{font-weight:700;font-size:1.2em;margin:1.4em 0 .7em;text-align:left;text-indent:0;color:var(--accent)}
#paper.blank::before{content:"여기에 떠오르는 대로 쓰고, 막히면 번개를 누르세요";position:absolute;left:0;top:48px;color:var(--muted);opacity:.7;pointer-events:none;text-indent:0;font-family:var(--ui);font-size:14.5px}
#paper .lt-new{text-decoration:underline dotted var(--accent);text-decoration-thickness:1.5px;text-underline-offset:.28em}
#paper .lt-live{background:var(--live);border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
#paper .lt-live::after{content:"";display:inline-block;width:2px;height:1.05em;margin-left:2px;vertical-align:-.15em;background:var(--accent);animation:blink 1s steps(2,start) infinite}
#paper .lt-live.wait::before{content:"생각하는 중…";font-family:var(--ui);font-size:12.5px;color:var(--accent);padding:0 4px}
@keyframes blink{to{visibility:hidden}}
#status{flex:none;display:flex;gap:6px 16px;flex-wrap:wrap;align-items:center;background:var(--chrome);border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-variant-numeric:tabular-nums}
#status b{color:var(--ink);font-weight:500}
#status label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
#status input{accent-color:var(--accent);width:15px;height:15px;margin:0}
#speed{display:inline-flex;align-items:center;gap:6px;margin-left:auto}

#fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:20;width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;box-shadow:0 4px 16px rgba(0,0,0,.22);display:inline-flex;align-items:center;justify-content:center;padding:0}
#fab:hover{background:var(--accent);filter:brightness(1.08)}
#fab svg{width:24px;height:24px;fill:currentColor;stroke:none}
#fab.busy{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px var(--live),0 4px 16px rgba(0,0,0,.22)}}
#live{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:21;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--paper);border-radius:20px;padding:6px 8px 6px 14px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#live button{background:transparent;color:inherit;border-color:rgba(127,127,127,.5);border-radius:14px;padding:2px 10px;font-size:12.5px}
#sug{position:fixed;z-index:22;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:0 8px 28px rgba(0,0,0,.18);max-width:calc(100vw - 100px)}
#sug button{font-size:12.5px;padding:4px 10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:max-content;max-width:min(92vw,520px);background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:8px;font-size:13px;line-height:1.55;z-index:70;box-shadow:0 6px 24px rgba(0,0,0,.25)}

.sheet{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end;background:var(--scrim)}
.sheet.left{justify-content:flex-start}
.sheet-box{background:var(--paper);color:var(--ink);width:min(580px,100%);height:100%;display:flex;flex-direction:column;box-shadow:0 0 32px rgba(0,0,0,.2);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.left .sheet-box{width:min(380px,92%);padding-left:env(safe-area-inset-left,0px)}
.sheet:not(.left) .sheet-box{padding-right:env(safe-area-inset-right,0px)}
.sheet-head{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 18px;border-bottom:1px solid var(--line);flex:none}
.sheet-head h2{font-size:15px;margin:0;font-weight:600;flex:1}
.sheet-body{flex:1;min-height:0;overflow:auto;padding:16px 18px 28px;overscroll-behavior:contain}
.sheet-foot{flex:none;display:flex;justify-content:space-between;gap:8px;padding:10px 18px;border-top:1px solid var(--line);background:var(--chrome)}
.err{color:var(--warn);font-size:12.5px;margin:6px 0 0;line-height:1.55}

#msList{list-style:none;margin:0;padding:0}
#msList h3{font-size:12px;font-weight:500;color:var(--muted);margin:16px 2px 6px;letter-spacing:.02em}
#msList li:first-child h3{margin-top:4px}
.ms{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;border:1px solid transparent;border-radius:8px;padding:8px 10px;background:transparent;white-space:normal}
.ms:hover{background:var(--hover)}
.ms.on{border-color:var(--accent)}
.ms-t{font-size:14px;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere}
.ms-m{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ms-m .due{color:var(--accent);font-weight:500}
#listMsg{margin:0 0 8px}

.range{margin:0 0 14px;padding:12px 14px;border-radius:8px;background:var(--chrome);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.range .w{font-size:12.5px;color:var(--muted)}
.range .q{font-family:var(--serif);font-size:15px;line-height:1.6;word-break:keep-all}
.range .n{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
#tidyWait{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px}
#tidyWait b{font-weight:500;color:var(--accent)}
.kinds{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:14px;font-size:12.5px;padding:4px 11px;display:inline-flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums}
.chip::before{content:"";width:9px;height:9px;border-radius:50%;flex:none}
.chip.k-edit::before{background:var(--t-ins)} .chip.k-del::before{background:var(--t-del)}
.chip.k-memo::before{background:var(--t-memo)} .chip.k-mat::before{background:var(--t-mat)}
.chip[aria-pressed="false"]::before{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}
#tidyReview > .hint{margin:8px 2px 12px}
.doc{font-family:var(--serif);font-size:15.5px;line-height:2.05;text-align:left;overflow-wrap:break-word}
.doc p{margin:0 0 .9em;text-indent:1em}
.doc p.sep{text-align:center;text-indent:0;color:var(--muted)}
.x{cursor:pointer;border-radius:3px;padding:1px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.x:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.x del,.x ins{text-decoration:none}
.x.k-edit.on del{color:var(--t-del);background:var(--t-del-bg);text-decoration:line-through}
.x.k-edit.on ins{color:var(--t-ins);background:var(--t-ins-bg)}
.x.k-edit:not(.on) ins{opacity:.45;text-decoration:line-through}
.x .sp{font-family:var(--ui);font-size:.8em;font-weight:700;padding:0 .12em;vertical-align:.25em;line-height:1}
.x.k-edit.on del.sp{text-decoration:none}
.x del.sp .s{font-size:1rem;font-weight:400}
.x.k-edit.on del.sp .s,.x.k-edit:not(.on) del.sp .m{display:none}
.x.k-edit:not(.on) del.sp{background:none;padding:0;vertical-align:baseline;font-size:inherit}
.x.k-edit:not(.on) ins.sp{display:none}
.x.k-del.on{color:var(--t-del);background:var(--t-del-bg);text-decoration:line-through}
.x.k-memo.on{color:var(--t-memo);background:var(--t-memo-bg);text-decoration:line-through}
.x.k-mat{color:var(--t-mat)}
.x.k-mat.on{background:var(--t-mat-bg)}
.x.k-mat:not(.on){opacity:.55;text-decoration:line-through}
.x:not(.on){outline:1px dashed var(--line);outline-offset:1px}
.tag{display:inline-block;font-family:var(--ui);font-size:11px;line-height:1.55;padding:0 7px;margin-left:4px;border-radius:9px;background:var(--hover);color:var(--muted);vertical-align:2px;text-indent:0;white-space:nowrap}

#note{width:100%;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13.5px;line-height:1.6;resize:vertical}
#frags{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.f{border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.fk{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.fk span{font-size:11.5px;padding:1px 8px;border-radius:9px;background:var(--t-mat-bg);color:var(--t-mat)}
.ft{margin:0;font-family:var(--serif);font-size:14.5px;line-height:1.75;white-space:pre-wrap}
.fm{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;font-size:11.5px;color:var(--muted)}
.fdel{font-size:12px;padding:2px 8px;color:var(--muted)}
.fdel.arm{color:var(--warn);font-weight:500}

/* ---------- 스토밍 ---------- */
#stormDlg .sheet-box{width:min(720px,100%)}
.st-in > summary,.st-hist > summary{cursor:pointer;font-size:13px;font-weight:600;padding:4px 0}
#stBrain{width:100%;min-height:150px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:var(--serif);font-size:15px;line-height:1.75;resize:vertical;margin-top:8px}
.st-opts{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:10px 0;font-size:13px;color:var(--muted)}
.st-opts label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.st-opts input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;margin:0}
#stTarget{width:68px;border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--paper);font-variant-numeric:tabular-nums}
.st-go{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
#stGoNote{font-size:12px;color:var(--muted)}
#stProg{font-size:13px;color:var(--accent);margin:6px 0 14px;min-height:1.2em;line-height:1.55}
.st-map{margin:4px 0 18px}
.st-groups,.st-segs{display:flex}
.st-groups span{font-size:11.5px;color:var(--muted);text-align:center;border-bottom:1px solid var(--line);padding-bottom:2px;min-width:0}
.st-map svg{display:block;width:100%;height:76px}
.st-map line{stroke:var(--line);vector-effect:non-scaling-stroke}
.st-map .zero{stroke-dasharray:3 4}
.st-map .cv{fill:none;stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.st-map .band{fill:var(--live)}
.st-segs button{min-width:0;border-radius:0;border:0;border-right:2px solid var(--paper);background:var(--chrome);font-size:11.5px;padding:5px 0;font-variant-numeric:tabular-nums;color:var(--muted)}
.st-segs button:last-child{border-right:0}
.st-segs button.has{color:var(--ink)}
.st-segs button.cur,.st-segs button.cur:hover{background:var(--accent);color:var(--accent-ink)}
.st-card{border:1px solid var(--line);border-radius:10px;padding:8px 12px 10px;margin:0 0 10px}
.st-card h3,.st-rv h3{margin:0 0 2px;font-size:12px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:8px}
.st-card h3 .sp,.st-rv h3 .sp{flex:1}
.st-ta{width:calc(100% + 12px);border:1px solid transparent;border-radius:6px;background:transparent;color:var(--ink);font-family:var(--serif);font-size:15px;line-height:1.75;padding:3px 6px;margin:0 -6px;resize:none;overflow:hidden;display:block}
.st-ta.ui{font-family:var(--ui);font-size:14px;line-height:1.65}
.st-ta:hover{border-color:var(--line)}
.st-ta:focus{border-color:var(--accent);background:var(--paper);outline:none}
.st-ta::placeholder{color:var(--muted);opacity:.7}
.st-grp{font-size:12px;font-weight:600;color:var(--accent);margin:20px 2px 6px;letter-spacing:.04em}
.st-ph{border:1px solid var(--line);border-radius:10px;margin:0 0 8px}
.st-ph.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.st-ph > summary{display:grid;grid-template-columns:auto auto 1fr auto;gap:2px 8px;align-items:baseline;padding:10px 12px;cursor:pointer;list-style:none}
.st-ph > summary::-webkit-details-marker{display:none}
.st-n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.st-nm{font-weight:600;font-size:14px}

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const paper = $('#paper'), scroller = $('#scroll');
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const norm = s => String(s || '').replace(/\s+/g, ' ').trim();
const clip = (t, k) => t.length > k ? t.slice(0, k) + '…' : t;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const hhmm = t => new Date(t).toLocaleTimeString('ko-KR', {hour: '2-digit', minute: '2-digit'});
const fmtWhen = t => { const d = new Date(t); if(isNaN(d)) return ''; return d.toDateString() === new Date().toDateString() ? hhmm(t) : (d.getMonth() + 1) + '월 ' + d.getDate() + '일'; };
const narrow = () => matchMedia('(max-width:640px)').matches;
function lsGet(k, d){ try{ const v = localStorage.getItem('mwlt-' + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem('mwlt-' + k, JSON.stringify(v)); }catch(e){} }

/* ================= 알림 ================= */
let toastT;
function toast(msg, ms){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, ms || 5000); }
function notice(text, label, fn){
  $('#noticeText').textContent = text; $('#notice').hidden = false;
  const b = $('#noticeBtn'); b.hidden = !label; b.textContent = label || ''; b.onclick = fn || null;
}
$('#noticeClose').onclick = () => { $('#notice').hidden = true; };

/* ================= 문장 나누기 · 비교 · 답 읽기 (앱의 라이트닝 1차와 같은 규칙) ================= */
const OPEN = '“‘「『（(〈《[{', CLOSE = '”’」』）)〉》]}';
const STOP = '.?!。？！', TERM = '.?!。？！…⋯';
const AFTER_Q = /^\s*(하고|하며|하면서|하는|하자|하니|하더니|하곤|하였다|했다|한다|하던|라고|라며|라는|라면서|이라고|이라며|고|며)(\s|$|[.,])/;
function splitSents(text){
  const out = [], n = text.length;
  let st = 0, depth = 0, dq = false, sq = false;
  const cut = k => { const s = text.slice(st, k).trim(); if(s) out.push(s); st = k; };
  const tryCut = (k, afterQ) => { if(k < n && !/\s/.test(text[k])) return; if(afterQ && AFTER_Q.test(text.slice(k))) return; cut(k); };
  const closeQ = i => { if(!depth && !dq && !sq && i > 0 && TERM.includes(text[i - 1])) tryCut(i + 1, true); };
  for(let i = 0; i < n; i++){
    const c = text[i];
    if(OPEN.includes(c)){ depth++; continue; }
    if(CLOSE.includes(c)){ depth = Math.max(0, depth - 1); closeQ(i); continue; }
    if(c === '"'){ if(dq){ dq = false; closeQ(i); } else dq = true; continue; }
    if(c === "'"){ if(sq){ sq = false; closeQ(i); } else sq = true; continue; }
    if(STOP.includes(c) && !depth && !dq && !sq){
      let j = i; while(j + 1 < n && TERM.includes(text[j + 1])) j++;
      const run = text.slice(i, j + 1); i = j;
      if(run.length > 1 && /^[.…⋯]+$/.test(run)) continue;
      tryCut(j + 1, false);
    }
  }
  cut(n);
  return out;
}
const splitKw = s => (s || '').split(/[,，、/]/).map(x => x.trim().replace(/^#/, '')).filter(Boolean).slice(0, 6);
function parseResp(raw, nSents){
  const res = {ops: {}, ins: [], kw: {}, hits: 0};
  let sec = '';
  for(const line of String(raw || '').replace(/```[a-zA-Z]*/g, '').split(/\r?\n/)){
    const l = line.trim().replace(/^[-*•>]\s*/, '').replace(/\*\*/g, '').trim();
    if(!l) continue;
    if(/^\[\s*정리\s*\]$/.test(l)){ sec = 't'; continue; }
    if(/^\[\s*조각\s*핵심어\s*\]$/.test(l)){ sec = 'k'; continue; }
    let m;
    if(sec === 'k' && (m = l.match(/^\{\s*(\d+)\s*\}\s*[:：]?\s*(.*)$/))){ res.kw[+m[1]] = splitKw(m[2]); continue; }
    m = l.match(/^\[\s*(\d+)\s*(\+)?\s*\]\s*(.*)$/);
    if(!m || sec === 'k') continue;
    const n = +m[1], rest = m[3].trim();
    if(n < 1 || n > nSents) continue;
    res.hits++;
    if(m[2]){ const fm = rest.match(/^\{\s*(\d+)\s*\}\s*(.*)$/), t = (fm ? fm[2] : rest).trim(); if(t) res.ins.push({after: n, frag: fm ? +fm[1] : null, t}); continue; }
    if(!rest || /^[=＝]/.test(rest) || rest === '그대로'){ res.ops[n] = {k: 'same'}; continue; }
    if(/^삭제\.?$/.test(rest)){ res.ops[n] = {k: 'del'}; continue; }
    const mm = rest.match(/^메모\s*(?:[|｜:：]\s*(.*))?$/);
    if(mm){ res.ops[n] = {k: 'memo', kw: splitKw(mm[1])}; continue; }
    res.ops[n] = {k: 'edit', t: rest};
  }
  return res;
}
function cdiff(a, b){
  const n = a.length, m = b.length;
  if(!n || !m || n * m > 160000) return null;
  const dp = []; for(let i = 0; i <= n; i++) dp.push(new Uint16Array(m + 1));
  for(let i = n - 1; i >= 0; i--) for(let j = m - 1; j >= 0; j--) dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const ops = []; let i = 0, j = 0;
  const push = (t, s) => { const l = ops[ops.length - 1]; if(l && l.t === t) l.s += s; else ops.push({t, s}); };
  while(i < n && j < m){ if(a[i] === b[j]){ push('=', a[i]); i++; j++; } else if(dp[i + 1][j] >= dp[i][j + 1]) push('-', a[i++]); else push('+', b[j++]); }
  while(i < n) push('-', a[i++]);
  while(j < m) push('+', b[j++]);

  const rest = norm(rt.toString().replace(/ /g, ' '));

async function bolt(){

  if(!$('#tidyDlg').hidden) return;

  if(!b){ b = paper.lastElementChild; r = document.createRange(); r.selectNodeContents(b); r.collapse(false); }
  if(r.endContainer === paper){ r = document.createRange(); r.selectNodeContents(b); r.collapse(false); }
  const c = contextAt(b, r);
  const key = keyOf(c.before);
  const prompt = boltPrompt(c, pickFrags(doc.lt), rejected.get(key) || [], prefs.len);

  const span = document.createElement('span'); span.className = 'lt-new lt-live wait';
  const tail = document.createTextNode(' ');
  if(isEmpty(b)){ b.textContent = ''; b.append(span, tail); }
  else { r.insertNode(tail); r.insertNode(span); }

  const put = t => {
    const s = cleanGen(t); if(!s) return;
    if(lead === null) lead = prevChar && !/\s/.test(prevChar) && !/^[.,!?…·:;)\]}'"”’」』〉》~]/.test(s) ? ' ' : '';
    span.classList.remove('wait'); span.textContent = lead + s;
  };
  const ctl = new AbortController();
  gen = {ctl, span};
  showLive(true, '쓰는 중…');
  try{
    const res = await sample(prompt, Object.assign({signal: ctl.signal, cache: false, onText: ({text}) => { put(text); keepVisible(span); }}, tierOpts()));
    put(res.text);
    if(res.truncated) toast('길이 제한에 걸려 중간에 멈췄습니다.');
  }catch(e){

}

const MAX = 4000, CTX = 500;
function ctxText(bs, i, dir){
  const out = []; let len = 0;
  for(; i >= 0 && i < bs.length && out.length < 3; i += dir){
    if(isEmpty(bs[i])) continue;
    const t = norm(textOf(bs[i])); out.push(t); len += t.length;
    if(len >= CTX || (dir < 0 && isChap(bs[i]))) break;
  }
  if(dir < 0) out.reverse();
  const txt = out.join('\n'), cap = CTX * 1.5;
  return txt.length > cap ? (dir < 0 ? '…' + txt.slice(-cap) : txt.slice(0, cap) + '…') : txt;
}
function computeRange(endB, selR, lt){
  const bs = blocks();
  let s = -1, e = -1, how = 'auto';
  if(selR){
    const a = blockOf(selR.startContainer === paper ? paper.childNodes[selR.startOffset] : selR.startContainer);
    const z = blockOf(selR.endContainer === paper ? paper.childNodes[Math.max(0, selR.endOffset - 1)] : selR.endContainer);
    s = bs.indexOf(a); e = bs.indexOf(z);
    if(s < 0 || e < s) selR = null; else how = 'sel';
  }
  if(!selR){
    e = endB ? bs.indexOf(endB) : -1;
    if(e < 0) e = bs.length - 1;
    while(e >= 0 && isEmpty(bs[e])) e--;
    if(e < 0) return {empty: 'none'};
    if(lt.mark && norm(textOf(bs[e])) === lt.mark) return {empty: 'done'};
    s = e;
    let chars = textOf(bs[e]).length;
    while(s > 0){
      const p = bs[s - 1];
      if(lt.mark && norm(textOf(p)) === lt.mark){ how = 'mark'; break; }
      if(isChap(p)){ how = 'chap'; break; }
      const l = textOf(p).length;
      if(chars + l > MAX){ how = 'cap'; break; }
      chars += l; s--;
    }
    if(s === 0 && how === 'auto') how = 'start';

    const raw = textOf(b), lead = (raw.match(/^\s+/) || [''])[0], text = raw.trim();
    if(isSep(b)){ paras.push({i, text, lead, sep: true, sents: []}); continue; }

    chars += text.length;
    paras.push({i, text, lead, sents});

  return {how, paras, n, chars, before: ctxText(bs, s - 1, -1), after: ctxText(bs, e + 1, 1)};
}

const fmtDay = t => { const d = new Date(t); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일'; };
function renderFrags(){
  const ul = $('#frags'); ul.textContent = '';
  const fs = doc ? doc.lt.frags : [];
  renderFragCount();
  if(!fs.length){ ul.innerHTML = '<li class="hint">아직 조각이 없습니다. 위에 생각을 적어 두거나, build할 때 원고 속 메모를 조각으로 옮길 수 있습니다.</li>'; return; }
  for(const f of fs.slice().reverse()){
    const li = document.createElement('li'); li.className = 'f';
    if(f.k && f.k.length){ const kk = document.createElement('div'); kk.className = 'fk'; f.k.forEach(w => { const s = document.createElement('span'); s.textContent = w; kk.appendChild(s); }); li.appendChild(kk); }
    const t = document.createElement('p'); t.className = 'ft'; t.textContent = f.t; li.appendChild(t);
    const m = document.createElement('div'); m.className = 'fm';
    const info = document.createElement('span');
    info.textContent = fmtDay(f.at) + ' · ' + (f.src === 'memo' ? '원고에서 옮김' : '직접 적음') + (f.used ? ' · 본문에 ' + f.used + '번 씀' : '');
    const del = document.createElement('button'); del.type = 'button'; del.className = 'ghost fdel'; del.textContent = '삭제';
    let armT;
    del.onclick = () => {
      if(!del.classList.contains('arm')){ del.classList.add('arm'); del.textContent = '정말 삭제'; armT = setTimeout(() => { del.classList.remove('arm'); del.textContent = '삭제'; }, 3000); return; }
      clearTimeout(armT); doc.lt.frags = doc.lt.frags.filter(x => x.id !== f.id); markChanged(); renderFrags();
    };
    m.append(info, del); li.appendChild(m); ul.appendChild(li);
  }
}
function saveNote(){
  const ta = $('#note'), t = ta.value.trim();
  ta.value = '';
  if(!t || !doc) return;
  doc.lt.frags.push({id: newId(), t, k: [], at: Date.now(), src: 'note', used: 0});
  markChanged(); renderFrags(); toast('조각으로 저장했습니다', 2500);
}
$('#fragBtn').onclick = () => { openSheet('fragDlg'); renderFrags(); if(!narrow()) $('#note').focus(); };
$('#noteSave').onclick = saveNote;
$('#note').addEventListener('input', e => { if(!e.isComposing && /\n[ \t]*\n$/.test($('#note').value)) saveNote(); });

/* ================= 스토밍: 브레인스토밍 → 8페이지즈 개요 → 인물표·연표 =================
   doc.lt.storm = {brain, useMs, target, endroll, cur, out, hist, cast, time, sync, ctDirty, outAt, ctAt, view, at}
   out  = {read, logline, kw: [], people: [{name, role, note}], phases: {reason: {t, s, b: []}, …}, pin: {칸: true}}
          칸 이름: read · logline · kw · people · ph:단계. 고정한 칸은 다시 스토밍해도 그대로 둔다.
   cast = [{id, name, role, age, desc, want, lack, arc, rel, mine}]   mine = 작가가 고친 항목 (다시 맞출 때 그대로)
   time = [{id, when, what, who, ph, mine}]   ph = 'pre'(이야기 전) 또는 단계 키. 이야기 속 시간 순서
   sync = 개요에 마지막으로 맞춘 때의 {cast, time}. 인물·연표를 고치면 이것과 견주어 바뀐 것만 개요에 반영한다.
   개요는 결말을 못 박는 틀이 아니라 작가가 길을 찾을 때 보는 지도다. */
const PH = [
  {k: 'reason', n: '리즌', g: '기', w: 5, d: '독자가 작품 세계에 빠져들게 하는 첫머리'},
  {k: 'setup', n: '셋업', g: '기', w: 20, d: '주인공을 중심으로 주요 관계가 서고, 갈등과 엇갈림이 조금씩 드러난다'},
  {k: 'adhoc', n: '애드혹 패러다임', g: '승', w: 10, d: '인물들이 임시로 만든 틀. 관계가 뚜렷해지는 전반부의 클라이맥스'},
  {k: 'sag', n: '새그', g: '승', w: 15, d: '빠른 전개가 멎고 긴장이 풀리며 템포가 늦어진다. 일상이나 축제 같은 장면, 다음 파국의 전조'},
  {k: 'dead', n: '데드 센터', g: '전', w: 15, d: '주인공의 상황이 급전직하한다. 마이너스의 클라이맥스'},
  {k: 'dash', n: '대시업', g: '전', w: 10, d: '밑바닥에서 단숨에 상황을 호전시킨다'},
  {k: 'climax', n: '클라이맥스', g: '결', w: 15, d: '복잡해진 이야기가 단숨에 수렴한다. 가장 많은 지면과 촘촘한 묘사, 갑자기 느려지기도 한다'},
  {k: 'newb', n: '뉴 비기닝', g: '결', w: 5, d: '새로운 일상, 주요 인물의 성장'},
  {k: 'endroll', n: '엔드롤', g: '결', w: 5, d: '이야기가 끝난 뒤의 여운', opt: true}
];
// 곡선: 가로는 분량(엔드롤까지 100), 세로는 긴장. 클라이맥스 정점은 애드혹 정점의 두 배, 데드 센터는 그만큼 깊다
const CURVE = [[0, 0], [5, .25], [9, .31], [13, .24], [17, .33], [21, .27], [25, .32], [35, .5], [38, .12], [42, .16], [46, .1], [50, .13], [58, -.32], [65, -.5], [75, .15], [85, .93], [88, 1], [90, .2], [95, .17], [100, .17]];
const CF = [['role', '자리'], ['age', '나이·신분'], ['desc', '외모·성격'], ['want', '바라는 것'], ['lack', '결핍·비밀'], ['arc', '변화 (처음 → 끝)'], ['rel', '관계']];
let stBusy = null, stRv = null, stCT = null, reflT = null;
const stOpen = new Set(), stAuto = new Set();
const stS = () => doc.lt.storm || (doc.lt.storm = {brain: '', useMs: true, target: 0, endroll: false, cur: null, out: null, hist: [], cast: null, time: null, sync: null, view: 'out', at: 0});
const stList = s => PH.filter(p => !p.opt || s.endroll);
const stTotal = s => stList(s).reduce((a, p) => a + p.w, 0);
const stAmt = (p, s) => s.target ? '약 ' + Math.max(1, Math.round(s.target * p.w / stTotal(s))) + '매' : Math.round(p.w / stTotal(s) * 100) + '%';
const phName = (k, s) => { if(k === 'pre') return '이야기 전'; const l = stList(s), i = l.findIndex(p => p.k === k); return i >= 0 ? (i + 1) + '. ' + l[i].n : ''; };
const toStr = v => typeof v === 'string' ? v.trim() : v == null ? '' : String(v).trim();
const toArr = v => Array.isArray(v) ? v : [];
const clone = x => JSON.parse(JSON.stringify(x));
function stNorm(j){
  j = j && typeof j === 'object' ? j : {};
  const o = {read: toStr(j.read), logline: toStr(j.logline), kw: toArr(j.kw).map(toStr).filter(Boolean).slice(0, 15),
    people: toArr(j.people).map(p => ({name: toStr(p && p.name), role: toStr(p && p.role), note: toStr(p && p.note)})).filter(p => p.name).slice(0, 12),
    phases: {}, pin: {}};
  const ph = j.phases && typeof j.phases === 'object' ? j.phases : {};
  for(const p of PH){ const x = ph[p.k]; if(x && typeof x === 'object') o.phases[p.k] = {t: toStr(x.t), s: toStr(x.s), b: toArr(x.b).map(toStr).filter(Boolean).slice(0, 8)}; }
  return o;
}
const derivePeople = cast => (cast || []).filter(c => c.name).map(c => ({name: c.name, role: c.role || '', note: [c.want, c.lack].filter(Boolean).join(' / ')}));
// 인물표는 있는데 개요에 맞춘 기록(sync)이나 인물 요약(people)이 빠진 원고를 받으면 지금 것으로 채운다
function stFill(s){
  if(!s || !s.out || !Array.isArray(s.cast)) return;
  if(!Array.isArray(s.time)) s.time = [];
  if(!s.sync) s.sync = {cast: clone(s.cast), time: clone(s.time)};
  s.out.phases = s.out.phases || {}; s.out.pin = s.out.pin || {};
  s.out.people = derivePeople(s.cast);
}
const keyGet = (o, k) => k.startsWith('ph:') ? (o.phases || {})[k.slice(3)] : o[k];
function keySet(o, k, v){ if(k.startsWith('ph:')){ o.phases = o.phases || {}; if(v === undefined) delete o.phases[k.slice(3)]; else o.phases[k.slice(3)] = v; } else o[k] = v; }
const peopleText = ps => (ps || []).map(p => [p.name, p.role, p.note].filter(Boolean).join(' | ')).join('\n');
function keyText(o, k){
  if(!o) return '';
  if(k === 'read' || k === 'logline') return o[k] || '';
  if(k === 'kw') return (o.kw || []).join(', ');
  if(k === 'people') return peopleText(o.people);
  const ph = (o.phases || {})[k.slice(3)];
  return ph ? [ph.t, ph.s].concat((ph.b || []).map(x => '· ' + x)).filter(Boolean).join('\n') : '';
}
function keyLabel(k, s){
  if(k === 'read') return '이야기의 뼈대'; if(k === 'logline') return '로그라인'; if(k === 'kw') return '핵심어'; if(k === 'people') return '인물';
  return phName(k.slice(3), s) || k;
}
const stKeys = s => ['read', 'logline', 'kw', 'people'].concat(stList(s).map(p => 'ph:' + p.k));
function pushHist(s, why){ if(!s.out) return; s.hist = [{at: Date.now(), why, out: clone(s.out)}].concat(s.hist || []).slice(0, 10); }
function msExcerpt(){
  const t = blocks().map(b => norm(textOf(b))).filter(Boolean).join('\n');
  return t.length <= 6000 ? t : t.slice(0, 2500) + '\n…(중략)…\n' + t.slice(-3000);
}
function outJson(s){
  const x = {read: s.out.read, logline: s.out.logline, kw: s.out.kw, people: s.out.people, phases: {}};
  stList(s).forEach(p => { if(s.out.phases[p.k]) x.phases[p.k] = s.out.phases[p.k]; });
  return JSON.stringify(x);
}
const pinNames = s => Object.keys((s.out && s.out.pin) || {}).filter(k => s.out.pin[k] && stKeys(s).includes(k)).map(k => k.startsWith('ph:') ? 'phases.' + k.slice(3) : k);
const ctJson = (cast, time, withIds) => JSON.stringify({
  cast: (cast || []).map(c => { const o = {}; if(withIds){ o.id = c.id; if(c.mine) o.mine = true; } ['name'].concat(CF.map(f => f[0])).forEach(f => { if(c[f]) o[f] = c[f]; }); return o; }),
  time: (time || []).map(t => { const o = {}; if(withIds){ o.id = t.id; if(t.mine) o.mine = true; } ['when', 'what', 'who', 'ph'].forEach(f => { if(t[f]) o[f] = t[f]; }); return o; })
});
function outFormat(s){ return JSON.stringify({read: '…', logline: '…', kw: ['…'], people: [{name: '…', role: '…', note: '…'}], phases: Object.fromEntries(stList(s).map(p => [p.k, {t: '…', s: '…', b: ['…']}]))}); }
function phaseLines(s){
  const L = ['', '[8페이지즈] 이야기의 굴곡을 단계로 나눈 틀이다. 결말을 못 박는 틀이 아니라 작가가 길을 찾을 때 보는 지도다.'];
  stList(s).forEach((p, i) => L.push((i + 1) + '. ' + p.n + ' (키 ' + p.k + ', 분량 ' + Math.round(p.w / stTotal(s) * 100) + '%): ' + p.d));
  L.push('높낮이: 클라이맥스의 정점은 애드혹 패러다임 정점의 두 배쯤이고, 데드 센터는 애드혹 정점만큼 깊이 떨어진다. 0 아래로 떨어지는 단계는 데드 센터뿐이다.');
  return L;
}
function materialLines(s){
  const L = ['', '[브레인스토밍]', s.brain.trim() || '(비어 있음)'];
  if(s.useMs){
    const fs = pickFrags(doc.lt);
    if(fs.length){ L.push('', '[조각] 작가가 모아 둔 소재'); fs.forEach(f => L.push('- ' + (f.k.length ? '(' + f.k.join(', ') + ') ' : '') + clip(f.t.replace(/\s+/g, ' '), 300))); }
    const ex = msExcerpt();
    if(ex) L.push('', '[지금까지 쓴 원고]' + (doc.title ? ' 「' + doc.title + '」' : ''), ex);
  }
  return L;
}
function stormPrompt(s, mode, ask){

  L.push('', '쓰는 법');

  L.push('- read: 이 이야기의 뼈대를 한두 문장으로. "무엇이 결핍된 인물이 어떤 장애물을 만나 무엇을 얻거나 잃는 이야기" 같은 꼴');

  L.push('- phases: 단계마다 t(한 줄 요약), s(줄거리 2~4문장), b(그 단계에 꼭 들어갈 장면이나 요소 2~4개)');
  L.push('- 문장은 담백한 한국어로 쓴다. 교훈이나 평가를 덧붙이지 않는다.');

  if(mode === 'again') L.push('- [지금 개요]에서 [고정] 칸은 작가가 정하거나 고친 것이다. 그대로 두고, 나머지 칸을 그것과 앞뒤가 맞게 새로 짠다. 고정 칸도 답에 그대로 적는다.');
  if(mode === 'ask') L.push('- [지금 개요]를 [작가의 지시]대로 고친다. 지시와 상관없는 칸은 글자 하나 바꾸지 말고 그대로 적는다. [고정] 칸은 지시가 그 칸을 콕 집어 말할 때만 바꾼다. 한 칸을 고쳐서 다른 칸과 어긋나면 그 칸도 맞춰 고친다.');
  if(s.cast && mode !== 'new') L.push('- [인물표]와 [연표]는 작가가 정리한 것이다. 개요가 이것과 어긋나지 않게 한다.');
  L.push('', '답은 JSON 하나만 쓴다. 형식:', outFormat(s));
  if(mode !== 'new' && s.out){
    L.push('', '[지금 개요]', outJson(s), '[고정] ' + (pinNames(s).join(', ') || '없음'));
    if(s.cast){ const ct = JSON.parse(ctJson(s.cast, s.time, false)); L.push('', '[인물표]', JSON.stringify(ct.cast), '', '[연표]', JSON.stringify(ct.time)); }
  }

function donePrompt(s){

function reflectPrompt(s, before, after){
  const L = ['작가가 소설의 인물표와 연표를 고쳤다. 고친 내용이 개요에 들어가도록 개요를 고쳐 줘.', ''];
  L.push('- [고치기 전]과 [고친 뒤]를 견주어 바뀐 것만 반영한다. 바뀐 것과 상관없는 칸은 글자 하나 바꾸지 말고 그대로 적는다.');
  L.push('- [고정] 칸은 작가가 정한 것이다. 이름이나 사실이 어긋나는 부분만 맞추고 나머지는 그대로 둔다.');
  L.push('- people은 [고친 뒤]의 인물표를 따른다.');
  L.push('', '답은 개요 JSON 하나만 쓴다. 형식:', outFormat(s));
  L.push(...phaseLines(s));
  L.push('', '[지금 개요]', outJson(s), '[고정] ' + (pinNames(s).join(', ') || '없음'));
  L.push('', '[고치기 전]', ctJson(before.cast, before.time, false));
  L.push('', '[고친 뒤]', ctJson(after.cast, after.time, false));
  return L.join('\n');
}
function setProg(t){ $('#stProg').textContent = t || ''; }
function setCT(text, acts){ stCT = {text, acts: acts || []}; const el = $('#stCT'); if(el) el.outerHTML = ctH(); }

function ctMerge(oldL, newL, fields){

  return d;
}
const safeName = t => (t || '제목 없는 원고').replace(/[\\/\[\]]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 100) || '제목 없는 원고';
const sentName = (title, id) => safeName(title) + ' [' + id + '].json';
const sentIdOf = t => (String(t || '').match(/\[([a-z0-9]+)\]\.json$/i) || [])[1] || null;
function driveErr(e, what){
  const c = e && e.code;

  if(c === 'server_not_connected' || c === 'server_not_found') return 'claude.ai 설정 → 커넥터에서 Google Drive를 연결해 주세요. 앱이 쓰는 구글 계정과 같은 계정이어야 합니다.';
  if(c === 'selection_required') return 'Google Drive 커넥터가 여러 개 있습니다. claude.ai가 띄우는 창에서 앱과 같은 구글 계정을 골라 주세요.';
  if(c === 'not_in_manifest' || c === 'approval_required' || c === 'consent_required') return '이 페이지가 Google Drive를 쓰도록 허락해야 합니다. 다시 누르면 허락 창이 뜹니다.';
  if(c === 'blocked_by_policy') return '조직 정책 때문에 이 페이지에서 Google Drive를 쓸 수 없습니다.';
  if(c === 'no_root' || c === 'no_data') return '드라이브에서 MYWONGO 폴더를 찾지 못했습니다. 앱에서 드라이브 연결을 켜고 한 번 동기화해 주세요.';
  if(c === 'bad_json') return '이 파일은 MYWONGO 원고 형식이 아닙니다.';
  if(c === 'tool_error') return 'Google Drive가 요청을 거절했습니다' + (e.message ? ': ' + clip(String(e.message), 120) : '.');
  if(what === 'send' && (c === 'server_unavailable' || c === 'upstream_error' || c === 'cancelled')) return '보냈는지 확실하지 않습니다. 앱에서 받아 보고, 들어오지 않았으면 다시 보내 주세요.';
  if(c === 'server_unavailable' || c === 'upstream_error' || c === 'rate_limited') return 'Google Drive가 잠시 응답하지 않습니다. 잠시 뒤 다시 해 주세요.';
  return '드라이브 작업을 마치지 못했습니다.';
}

/* ---------- 원고 목록 ---------- */
let syncItems = null, sentItems = [], sentLoaded = false, listBusy = false;
let meta = lsGet('meta', {});   // 드라이브 파일 → {ms: 원고 id, trashed}
const msOfSync = it => it.ms || (meta[it.file.id] && meta[it.file.id].ms) || null;
function setSyncItems(sf){
  // 앱의 동기화 파일 이름은 「제목 [원고 id].json」. 예전 이름(id 없음)은 한 번 열어 본 기록(meta)으로 알아본다
  syncItems = sf.filter(f => /\.json$/i.test(f.title || '')).map(f => ({kind: 'sync', file: f, ms: sentIdOf(f.title), title: String(f.title).replace(/\s*\[[a-z0-9]+\]\.json$/i, '').replace(/\.json$/i, ''), mod: Date.parse(f.modifiedTime) || 0}));
}
function setSentItems(tf){
  sentItems = tf.map(f => ({kind: 'sent', file: f, ms: sentIdOf(f.title), title: String(f.title || '').replace(/\s*\[[a-z0-9]+\]\.json$/i, ''), mod: Date.parse(f.modifiedTime) || 0})).filter(x => x.ms);
  sentLoaded = true;
}
function sentFor(ms){ return sentItems.filter(s => s.ms === ms).sort((a, b) => b.mod - a.mod)[0] || null; }

/* ---------- 앱에서 완전히 지운 원고 ----------
   앱은 완전히 지운 원고를 '동기화 자료' 폴더의 「지운 원고 기록」에 남긴다({ids: {원고 id: 지운 때}}).
   지운 때까지 여기서 보낸 파일은 휴지통에 넣고, 이 브라우저의 사본도 지운다.
   지운 뒤에 여기서 고쳤거나 다시 보낸 사본은 남긴다. 레이닝 하면 앱에 새 원고로 다시 들어간다 */
const GONE = '지운 원고 기록';
const goneKeptMsg = d => (d.sentAt || 0) > goneAt(d.id)
  ? '앱에서 완전히 지운 뒤 여기서 다시 보낸 원고입니다. 앱에서 받으면 새 원고로 들어갑니다.'
  : '앱에서 완전히 지운 원고입니다. 지운 뒤에 여기서 고친 것이 있어 남겨 두었습니다. 레이닝 하면 앱에 새 원고로 다시 들어갑니다.';
let gone = lsGet('gone', {});
const goneNoted = new Set();
function goneAt(ms){ return (ms && gone[ms]) || 0; }
function keepGone(d){ const t = goneAt(d.id); return (d.changed && (d.editAt || 0) > t) || (d.sentAt || 0) > t; }
function isGone(d){ return !!(d && goneAt(d.id) && !keepGone(d)); }
const sentGone = s => goneAt(s.ms) && s.mod <= goneAt(s.ms);
async function loadGone(sf){
  const fs = sf.filter(f => f.title === GONE);
  const rev = fs.map(f => f.id + ':' + f.modifiedTime).join(',');
  if(!fs.length || rev === lsGet('gone-rev', '')) return false;
  const ids = {};
  for(const f of fs){
    const j = await fetchRaw(f.id);
    if(j && j.app === 'wongo' && j.kind === 'gone' && j.ids && typeof j.ids === 'object')
      for(const [k, t] of Object.entries(j.ids)) if(typeof t === 'number') ids[k] = Math.max(ids[k] || 0, t);
  }
  gone = ids; lsSet('gone', gone); lsSet('gone-rev', rev);
  for(const k of Object.keys(meta)) if(meta[k] && gone[meta[k].ms]) delete meta[k];
  lsSet('meta', meta);
  return true;
}
function sweepGone(){
  let n = 0;
  for(const d of Object.values(drafts)) if(isGone(d) && !(doc && doc.id === d.id)){ delete drafts[d.id]; n++; }
  if(n) lsSet('drafts', drafts);
  if(doc && !doc.fresh && goneAt(doc.id)){
    if(keepGone(doc)){
      if(!goneNoted.has(doc.id)){ goneNoted.add(doc.id); notice(goneKeptMsg(doc)); }
    } else if(!gen && !sending && !stBusy){
      const t = doc.title || '제목 없는 원고';
      delete drafts[doc.id]; lsSet('drafts', drafts);
      doc = null; newDoc();
      notice('「' + t + '」은(는) 앱에서 완전히 지운 원고라 여기서도 닫았습니다.');
    }
  }
  if(!$('#listDlg').hidden) renderList();
}
async function applyGone(sf, sentFresh){
  let fresh = false;
  try{ fresh = await loadGone(sf); }catch(e){ /* 다음에 다시 읽는다 */ }
  sweepGone();
  // 기록이 바뀌었거나 이번에 아직 보낸 원고 폴더를 안 봤으면, 지운 원고의 보낸 파일을 찾아 치운다
  if(!sentFresh && Object.keys(gone).length && (fresh || !sentLoaded)){
    try{ const d = await findDirs(); if(d.sent) setSentItems(await listQ('parentId = ' + qs(d.sent))); }catch(e){}
  }
  sweepSent();   // 휴지통에 넣는 동안 목록을 막지 않는다
}
let sweeping = false;
async function sweepSent(){
  const dead = sentItems.filter(sentGone);
  if(!dead.length || sweeping) return;
  sweeping = true;
  sentItems = sentItems.filter(s => !sentGone(s));
  if(!$('#listDlg').hidden) renderList();
  try{ for(const s of dead){ try{ await dcall('trash_file', {fileId: s.file.id}); }catch(e){} } }
  finally{ sweeping = false; }
}

async function loadList(){
  if(listBusy) return;
  if(!mcp){ $('#listMsg').textContent = 'claude.ai 안에서 이 페이지를 열어야 드라이브의 원고를 볼 수 있습니다. 지금은 이 기기에 저장한 원고만 보입니다.'; renderList(); return; }
  listBusy = true;
  $('#listMsg').textContent = '드라이브에서 원고 목록을 불러오는 중…';
  try{
    const d = await findDirs();
    const [sf, tf] = await Promise.all([listQ('parentId = ' + qs(d.data)), d.sent ? listQ('parentId = ' + qs(d.sent)) : Promise.resolve([])]);
    setSyncItems(sf);
    setSentItems(tf);
    await applyGone(sf, true);
    $('#listMsg').textContent = syncItems.length ? '' : '드라이브에 앱의 원고가 아직 없습니다. 앱에서 드라이브 동기화를 켜면 여기에 보입니다.';
  }catch(e){
    $('#listMsg').textContent = driveErr(e, 'list');
  }finally{ listBusy = false; renderList(); }
}
function msItem(label, sub, due, on, fn){
  const li = document.createElement('li'), b = document.createElement('button');
  b.type = 'button'; b.className = 'ms' + (on ? ' on' : '');
  const t = document.createElement('span'); t.className = 'ms-t'; t.textContent = label || '제목 없는 원고';
  const m = document.createElement('span'); m.className = 'ms-m'; m.textContent = sub;
  if(due){ const s = document.createElement('span'); s.className = 'due'; s.textContent = ' · ' + due; m.appendChild(s); }
  b.append(t, m); b.onclick = fn; li.appendChild(b); return li;
}
function groupHead(text){ const li = document.createElement('li'); li.innerHTML = '<h3></h3>'; li.firstChild.textContent = text; return li; }
function renderList(){
  const ul = $('#msList'); ul.textContent = '';
  const cur = doc && doc.id;
  const local = Object.values(drafts).filter(d => d.changed && !isGone(d)).sort((a, b) => (b.at || 0) - (a.at || 0));
  if(local.length){
    ul.appendChild(groupHead('여기서 고치고 아직 보내지 않은 원고'));
    for(const d of local) ul.appendChild(msItem(d.title, ((d.chars || 0) / 200).toFixed(1) + '매 · ' + fmtWhen(d.at) + (goneAt(d.id) ? ' · 앱에서 지움' : ''), '보낼 내용 있음', cur === d.id, () => { openDoc(drafts[d.id]); closeSheet('listDlg'); }));
  }
  if(syncItems){
    const known = new Set();
    const rows = syncItems.slice().sort((a, b) => b.mod - a.mod);
    if(rows.length) ul.appendChild(groupHead('앱의 원고'));
    for(const it of rows){
      const mi = meta[it.file.id], ms = msOfSync(it); if(ms) known.add(ms);
      const s = ms && sentFor(ms), waiting = s && s.mod > it.mod;
      const dr = ms && drafts[ms], appNew = dr && dr.appMod && it.mod > dr.appMod;
      ul.appendChild(msItem(it.title, fmtWhen(it.mod) + (mi && mi.trashed ? ' · 앱의 휴지통' : ''), dr && dr.changed ? '보낼 내용 있음' + (appNew ? ' · 앱에서도 고침' : '') : appNew ? '앱에서 고침' : waiting ? '보냈고 앱에서 받기 전' : '', cur && cur === ms, () => openItem(it)));
    }
    const pending = sentItems.filter(s => !known.has(s.ms) && !sentGone(s)).sort((a, b) => b.mod - a.mod).filter((s, i, a) => a.findIndex(x => x.ms === s.ms) === i);
    if(pending.length){
      ul.appendChild(groupHead('여기서 보낸 원고'));
      for(const s of pending) ul.appendChild(msItem(s.title, '보낸 때 ' + fmtWhen(s.mod), '', cur === s.ms, () => openItem(s)));
    }
  }
}
async function openItem(it, pre){
  if(listBusy) return;
  listBusy = true;
  $('#listMsg').textContent = '「' + it.title + '」을(를) 불러오는 중…';
  try{
    let rec, fromSent = false;
    if(it.kind === 'sync'){
      rec = pre || await fetchJson(it.file.id);
      meta[it.file.id] = {ms: rec.id, trashed: !!rec.trashed}; lsSet('meta', meta);
      const s = sentFor(rec.id);
      if(s && s.mod > it.mod){ rec = await fetchJson(s.file.id); fromSent = true; }
    } else { rec = await fetchJson(it.file.id); fromSent = true; }
    const base = fromSent ? (rec.base || 0) : (rec.updatedAt || 0);
    const chain = fromSent ? (rec.chain || []).concat(rec.updatedAt || 0) : [];
    const sy = it.kind === 'sync' ? it : (syncItems || []).find(x => msOfSync(x) === rec.id);
    const remote = {id: rec.id, title: rec.title || '', html: rec.html, chars: rec.chars || 0, lt: normLt(rec.lt), base, chain, changed: false, trashed: !!rec.trashed && !fromSent, src: it.file.id, sentAt: fromSent ? rec.sentAt || rec.updatedAt : null, syncId: sy ? sy.file.id : null, appMod: sy ? sy.mod : 0};
    const dr = drafts[rec.id];
    $('#listMsg').textContent = '';
    closeSheet('listDlg');
    if(dr && dr.changed){
      openDoc(dr);
      const appMoved = !fromSent && (rec.updatedAt || 0) > (dr.base || 0) && !(dr.chain || []).includes(rec.updatedAt);
      notice(appMoved
        ? '여기서 고치고 아직 보내지 않은 사본을 열었습니다. 그사이 앱에서도 이 원고를 고쳤습니다. 이대로 보내면 앱에는 「… (라이트닝 사본)」으로 따로 남습니다.'
        : '여기서 고치고 아직 보내지 않은 사본을 열었습니다.',
        '드라이브 판으로 열기', () => { delete drafts[rec.id]; lsSet('drafts', drafts); openDoc(remote); });
    } else openDoc(remote);
  }catch(e){
    $('#listMsg').textContent = driveErr(e, 'open');
  }finally{ listBusy = false; }
}
$('#listBtn').onclick = () => { openSheet('listDlg'); renderList(); if(!syncItems || !sentLoaded) loadList(); checkApp(); };

/* ---------- 앱에서 레이닝 한 판 받기 ----------
   이 페이지를 열 때, 이 페이지로 돌아올 때, 목록을 열 때 지금 원고의 앱 판(동기화 자료)을 살핀다.
   앱이 그 뒤로 고쳤으면: 여기서 아직 보내지 않은 변경이 없으면 바로 받고, 있으면 받을지 묻는다. */
let appBusy = false, appAt = 0;
function mergeLtIn(a, b){   // a = 앱 판, b = 여기. 조각은 합치고, 스토밍은 더 나중에 고친 쪽
  a = normLt(a); b = normLt(b);
  const m = new Map(); for(const f of b.frags) m.set(f.id, f); for(const f of a.frags) m.set(f.id, Object.assign({}, m.get(f.id) || {}, f));
  const out = Object.assign({}, b, a, {frags: [...m.values()].sort((x, y) => (x.at || 0) - (y.at || 0)), mark: a.mark || b.mark || null});
  const sa = a.storm, sb = b.storm; if(sa || sb) out.storm = !sa ? sb : !sb ? sa : ((sa.at || 0) >= (sb.at || 0) ? sa : sb);
  return out;
}
const appDoc = (rec, it, prev) => ({id: rec.id, title: rec.title || '', html: rec.html, chars: rec.chars || 0, lt: mergeLtIn(rec.lt, prev && prev.lt), base: rec.updatedAt || 0, chain: [], changed: false, trashed: !!rec.trashed, src: it.file.id, syncId: it.file.id, appMod: it.mod, sentAt: prev ? prev.sentAt : null});
async function checkApp(force){
  if(!mcp || !doc || doc.fresh || appBusy || gen || sending || stBusy) return;
  if(!force && Date.now() - appAt < 15000) return;
  appBusy = true; appAt = Date.now();
  const id = doc.id;
  try{
    const d = await findDirs();
    const sf = await listQ('parentId = ' + qs(d.data));
    setSyncItems(sf); await applyGone(sf);
    if(!$('#listDlg').hidden) renderList();
    if(!doc || doc.id !== id) return;
    const it = syncItems.find(x => msOfSync(x) === id || (doc.syncId && x.file.id === doc.syncId));
    if(!it || !doc || doc.id !== id || (doc.appMod && it.mod <= doc.appMod)) return;
    const rec = await fetchJson(it.file.id);
    meta[it.file.id] = {ms: rec.id, trashed: !!rec.trashed}; lsSet('meta', meta);
    if(!doc || doc.id !== id || rec.id !== id) return;
    doc.appMod = it.mod; doc.syncId = it.file.id;
    snapshot();
    const known = (rec.updatedAt || 0) <= (doc.base || 0) || (doc.chain || []).includes(rec.updatedAt) || (rec.html === doc.html && (rec.title || '') === (doc.title || ''));
    if(known){ saveLocal(); return; }
    if(!doc.changed){
      openDoc(appDoc(rec, it, doc)); saveLocal();
      notice('앱에서 고친 판' + (rec.sentLt ? '(레이닝)' : '') + '을 받아 열었습니다. 여기서 이어서 작업하면 됩니다.');
    } else {
      notice('앱에서도 이 원고를 고쳐 보냈습니다. 여기서 고친 것은 아직 앱에 보내지 않았습니다. 앱 판을 받으면 여기서 고친 것은 사라지고, 그대로 레이닝 하면 앱에는 「… (라이트닝 사본)」으로 따로 남습니다.', '앱 판 받기', () => {
        $('#notice').hidden = true; openDoc(appDoc(rec, it, doc)); saveLocal(); toast('앱 판을 받았습니다.', 3000);
      });
    }
  }catch(e){ /* 조용히 넘어가고 다음에 다시 살핀다 */ }
  finally{ appBusy = false; }
}
/* ---------- 앱이 보낸 원고 따라가기 ----------
   앱에서 레이닝이나 라이트닝(번개)을 누르면 그 원고의 동기화 파일에 sentLt(보낸 때)가 붙는다.
   이 페이지를 열 때·돌아올 때 앱이 가장 최근에 고친 원고를 살펴, 아직 따라가지 않은 보내기면 그 원고를 연다.
   앱의 번개는 창을 먼저 열고 보내기를 하므로, 연 직후 몇 번 더 살핀다. */
let follow = lsGet('follow', {mod: 0, sent: 0}), followBusy = false, followAt = 0;
const nap = ms => new Promise(r => setTimeout(r, ms));
async function followApp(force){
  if(!mcp || followBusy || gen || sending || stBusy) return false;
  if(!force && Date.now() - followAt < 2000) return false;
  followBusy = true; followAt = Date.now();
  try{
    const d = await findDirs();
    const sf = await listQ('parentId = ' + qs(d.data));
    setSyncItems(sf); await applyGone(sf);
    if(!$('#listDlg').hidden) renderList();
    const top = syncItems.slice().sort((a, b) => b.mod - a.mod)[0];
    if(!top || top.mod <= (follow.mod || 0)) return false;
    follow.mod = top.mod; lsSet('follow', follow);
    const rec = await fetchJson(top.file.id);
    meta[top.file.id] = {ms: rec.id, trashed: !!rec.trashed}; lsSet('meta', meta);
    if(!rec.sentLt || rec.sentLt <= (follow.sent || 0)) return false;
    follow.sent = rec.sentLt; lsSet('follow', follow);
    if(doc && !doc.fresh && doc.id === rec.id){ followBusy = false; await checkApp(true); return true; }
    for(let i = 0; listBusy && i < 60; i++) await nap(200);
    const prev = doc && !doc.fresh ? (doc.title || '제목 없는 원고') : null, hadDraft = !!(drafts[rec.id] && drafts[rec.id].changed);
    await openItem(top, rec);
    if(!doc || doc.id !== rec.id) return false;
    if(!hadDraft) notice('앱에서 보낸 「' + (rec.title || '제목 없는 원고') + '」을(를) 열었습니다.' + (prev && prev !== (rec.title || '제목 없는 원고') ? ' 보던 「' + prev + '」은(는) 원고 목록에 있습니다.' : ''));
    return true;
  }catch(e){ return false; }
  finally{ followBusy = false; }
}
async function followThenCheck(force){ if(!(await followApp(force))) checkApp(force); }
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') followThenCheck(); });
$('#listReload').onclick = loadList;
$('#newBtn').onclick = () => { newDoc(); closeSheet('listDlg'); if(!narrow()) paper.focus(); };

/* ---------- 앱으로 보내기 ---------- */
$('#sendBtn').onclick = send;
async function send(){
  if(!doc || sending || gen) return;
  if(!mcp){ toast('claude.ai 안에서 열어야 드라이브로 보낼 수 있습니다.'); return; }
  saveLocal();
  if(!norm(plain()) && !doc.title){ toast('보낼 글이 없습니다.'); return; }
  sending = true; renderState();
  const seq = editSeq, b = $('#sendBtn'); b.classList.add('busy'); b.setAttribute('aria-busy', 'true');
  try{
    const d = await findDirs();
    if(!d.sent){
      const kids = await listQ('parentId = ' + qs(d.root) + ' and mimeType = ' + qs(FOLDER));
      const ex = kids.find(k => k.title === SENT);
      d.sent = ex ? ex.id : (await dcall('create_file', {title: SENT, parentId: d.root, contentMimeType: FOLDER})).id;
    }
    const now = Date.now();
    const body = {app: 'wongo', v: 1, from: 'lightning', id: doc.id, title: doc.title || '제목 없는 원고', html: doc.html, chars: doc.chars, updatedAt: now, trashed: false, trashedAt: null, lt: doc.lt || null, base: doc.base || 0, chain: (doc.chain || []).slice(-20), sentAt: now};
    const res = await dcall('create_file', {title: sentName(body.title, doc.id), parentId: d.sent, textContent: JSON.stringify(body), contentMimeType: 'application/json', disableConversionToGoogleType: true});
    doc.chain = (doc.chain || []).concat(now).slice(-20); doc.sentAt = now;
    if(editSeq === seq) doc.changed = false;
    saveLocal(); renderState();
    toast('앱으로 보냈습니다. 앱의 불러오기 메뉴에서 「라이트닝에서 받기」를 누르면 들어갑니다.', 8000);
    // 이 원고를 지난번에 보낸 파일은 휴지통으로
    try{
      const olds = (await listQ('parentId = ' + qs(d.sent))).filter(f => sentIdOf(f.title) === doc.id && f.id !== (res && res.id));
      for(const f of olds) await dcall('trash_file', {fileId: f.id});
    }catch(e){}
    syncItems = null;
  }catch(e){
    toast(driveErr(e, 'send'), 10000);
  }finally{ sending = false; b.classList.remove('busy'); b.removeAttribute('aria-busy'); renderState(); }
}

/* ================= 시작 ================= */
window.addEventListener('pagehide', saveLocal);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') saveLocal(); });
(async function boot(){
  try{ document.execCommand('defaultParagraphSeparator', false, 'div'); }catch(e){}
  renderPrefs();
  sweepGone();   // 지난번에 받아 둔 지운 원고 기록으로 이 브라우저의 사본부터 치운다
  const last = lsGet('last', null);
  if(last && drafts[last]) openDoc(drafts[last]);
  else { newDoc(); openSheet('listDlg'); renderList(); $('#listMsg').textContent = '드라이브에 연결하는 중…'; }
  const c = window.claude;
  const [s, m] = c && typeof c.use === 'function'
    ? await Promise.all([c.use('sample').catch(() => null), c.use('mcp').catch(() => null)])
    : [null, null];
  sample = s; mcp = m;
  $('#fab').hidden = false;
  if(!sample){ $('#fab').title = '번개는 claude.ai 안에서 이 페이지를 열었을 때 칩니다'; }
  renderState();
  if(!$('#listDlg').hidden) loadList();
  await followThenCheck(true);
  // 앱의 번개로 열렸다면 앱의 보내기가 조금 늦게 끝날 수 있다
  for(const ms of [4000, 9000, 18000]){ await nap(ms); if(document.visibilityState === 'visible' && await followApp(true)) break; }
})();

/* ================= 말풍선: 아이콘에 마우스를 올리면 이름과 하는 일을 보여 준다 (휴대폰에서는 뜨지 않음) ================= */
(function tips(){
  document.querySelectorAll('[data-tip][title]').forEach(el => el.removeAttribute('title'));
  const tip = document.createElement('div'); tip.id = 'tip'; tip.hidden = true; tip.setAttribute('role', 'tooltip'); document.body.appendChild(tip);
  let timer = null, on = null;
  const show = el => {
    if(!el.isConnected) return;
    tip.textContent = '';
    const b = document.createElement('b'); b.textContent = el.dataset.tip; tip.appendChild(b);
    if(el.dataset.tipD){ const d = document.createElement('span'); d.textContent = el.dataset.tipD; tip.appendChild(d); }
    tip.hidden = false;
    const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    let top = r.bottom + 8; if(top + h > innerHeight - 8) top = r.top - h - 8;
    tip.style.top = Math.round(top) + 'px'; tip.style.left = Math.round(Math.max(8, Math.min(r.left + r.width / 2 - w / 2, innerWidth - w - 8))) + 'px';
  };
  const hide = () => { clearTimeout(timer); tip.hidden = true; on = null; };
  document.addEventListener('pointerover', e => {
    if(e.pointerType && e.pointerType !== 'mouse') return;
    const el = e.target.closest && e.target.closest('[data-tip]');
    if(el === on) return;
    hide(); if(!el) return;
    on = el; timer = setTimeout(() => show(el), 350);
  });
  document.addEventListener('pointerdown', hide, true);
  document.addEventListener('keydown', e => { if(e.key === 'Escape') hide(); }, true);
  document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if(el && el.matches(':focus-visible')){ on = el; show(el); } });
  document.addEventListener('focusout', e => { if(on && e.target === on) hide(); });  // 다른 곳(닫힌 창의 단추)에서 빠진 포커스는 상관하지 않는다
  addEventListener('scroll', hide, true);
})();
})();
</script>
